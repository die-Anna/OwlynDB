# HAProxy vor den Test-Datenbanken: TLS ab dem ersten Byte, Client-Zertifikat der Test-CA ist Pflicht.
global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    # Client-CN und SNI mitschreiben, um zu sehen, was ankommt
    log-format "%ci %ft->%b cn=%[ssl_c_s_dn(cn)] sni=%[ssl_fc_sni] verify=%[ssl_c_verify] dauer=%Tt ende=%ts"
    timeout connect 5s
    timeout client 1m
    timeout server 1m
    # Adressen zur Laufzeit auflösen: HAProxy startet auch, wenn ein Container fehlt (z. B. MSSQL aus, es8 nur im Profil elastic)
    default-server init-addr last,libc,none resolvers docker

frontend mysql_mtls
    bind :3306 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    default_backend mysql

frontend pg_mtls
    bind :5432 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    default_backend pg

frontend mssql_mtls
    bind :1433 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    default_backend mssql

# kurzer Leerlauf-Timeout: zeigt, ob offene Sitzungen abreißen
frontend pg_short
    bind :6432 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    timeout client 3s
    default_backend pg_kurz

frontend mysql_short
    bind :6306 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    timeout client 3s
    default_backend mysql_kurz

frontend mssql_short
    bind :6433 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    timeout client 3s
    default_backend mssql_kurz

# SSH im TLS-Tunnel (wie ProxyCommand openssl s_client -servername …): Ziel nach SNI-Name
frontend ssh_mtls
    bind :2222 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    tcp-request content reject unless { ssl_fc_sni -i ssh-test }
    default_backend ssh

# dasselbe mit 20 s Leerlauf-Timeout: SSH-Keepalive (15 s) muss die Verbindung halten
frontend ssh_short
    bind :2223 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    tcp-request content reject unless { ssl_fc_sni -i ssh-test }
    timeout client 20s
    default_backend ssh_kurz

# Elasticsearch 8.10: HTTPS mit Client-Zertifikat, dahinter HTTP (wie ein Proxy vor einem ungesicherten Cluster)
frontend es_mtls
    bind :9200 ssl crt /certs/server.pem ca-file /certs/ca.crt verify required
    default_backend es

# Docker-DNS für default-server oben
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

backend es
    server es es8:9200

backend ssh
    server ssh ssh:22

backend ssh_kurz
    timeout server 20s
    server ssh ssh:22

backend mysql
    server db mysql:3306

backend pg
    server db postgres:5432

backend pg_kurz
    timeout server 3s
    server db postgres:5432

backend mssql
    server db mssql:1433

backend mysql_kurz
    timeout server 3s
    server db mysql:3306

backend mssql_kurz
    timeout server 3s
    server db mssql:1433
